services:
  tempostrike-auth:
    build: .
    image: tempostrike-auth:local
    container_name: tempostrike-auth
    restart: unless-stopped
    env_file:
      - /home/ubuntu/tempostrike/tempostrike.env
    volumes:
      - ./uploads:/app/uploads
    networks:
      - shared-cloud

networks:
  shared-cloud:
    external: true
    name: gitlab-net
